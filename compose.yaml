services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3070:3070"
    environment:
      PORT: "3070"
      APP_ORIGIN: "http://localhost:3070"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      SECURE_COOKIES: "false"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  app-data:
